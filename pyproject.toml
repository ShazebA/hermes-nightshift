[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-nightshift"
version = "0.1.0"
description = "An always-on night shift for your GitHub repos: a cheap local Hermes model watches CI, triages failures and hands finished briefs to stronger coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Shazeb" }]
keywords = ["hermes-agent", "ci", "triage", "github-actions", "agents", "aetherbus", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
# AetherBus (optional sink) is not on PyPI; pinned to a commit whose wheel builds from a clean
# git checkout (ShazebA/aetherbus#12). [mcp] brings `aetherbus-mcp` for coding agents.
aetherbus = ["aetherbus[mcp] @ git+https://github.com/ShazebA/aetherbus.git@a64f324bc28454fb2eea8bd86987ed6550385d54"]
dev = ["pytest>=8,<10", "jsonschema>=4.21,<5", "ruff>=0.6,<0.16"]

[project.scripts]
nightshift = "nightshift.cli:main"

[project.urls]
Homepage = "https://github.com/ShazebA/hermes-nightshift"

[tool.hatch.metadata]
allow-direct-references = true  # the git-pinned [aetherbus] extra

[tool.hatch.build.targets.wheel]
packages = ["src/nightshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
